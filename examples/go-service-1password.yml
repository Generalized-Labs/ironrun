# A Go backend service with secrets in 1Password.
# Requires the `op` CLI installed and signed in (`op signin`).
version: "1"
provider: 1password

commands:
  - id: test
    argv: [go, test, ./...]
    ttl: 10m
    max_bytes: 10485760     # 10MB output cap

  - id: build
    argv: [go, build, -o, bin/server, ./cmd/server]
    ttl: 5m

  - id: integration-test
    argv: [go, test, -tags=integration, ./...]
    ttl: 20m
    env:
      TEST_DATABASE_URL: "op://Engineering/dev-db/url"
      TEST_API_KEY:      "op://Engineering/api/test_key"

  - id: deploy
    argv: [./scripts/deploy.sh, --prod]
    ttl: 30m
    env:
      DEPLOY_TOKEN:   "op://Production/deploy/token"
      DATABASE_URL:   "op://Production/db/url"
      AWS_ACCESS_KEY: "op://Production/aws/access_key_id"
      AWS_SECRET_KEY: "op://Production/aws/secret_access_key"
