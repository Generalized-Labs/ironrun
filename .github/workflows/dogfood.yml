name: Dogfood

# ironrun's own CI runs sealed: this workflow dogfoods the tool we ship.
# It installs the published ironrun Action/release, runs a secret-bearing command
# through `ironrun run` with the seal ON (seccomp sandbox + streamed
# redaction + audit trail), then proves:
#   1. the canary secret never appears in anything the job saw (redactor works), and
#   2. the audit record for the run shows seccomp_installed: true and the
#      hash chain verifies (the run was genuinely sealed and tamper-logged).
#
# Dogfoods the PUBLISHED verified GitHub Action (action.yml): CI installs the
# signed v0.5.0+ release (checksums.txt Sigstore-verified, tarball cosign-verified,
# fail-closed at every step), then runs a secret-bearing command through it — the
# exact consumer path, exercised on every push to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dogfood:
    name: "Dogfood — CI runs sealed"
    # The Action correctly refuses fork-PR events, so only dogfood trusted ones.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # seccomp is the Linux story; the seal is proven on the Linux runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 1 - POLICY: fresh random canary each run; hermetic audit path outside
      # the real audit log.
      - name: "1 - Policy: fresh canary + demo policy"
        run: |
          CANARY="dogfood-canary-$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          echo "IRONRUN_DOGFOOD_CANARY=$CANARY" >> "$GITHUB_ENV"
          echo "::add-mask::$CANARY"
          mkdir -p /tmp/ironrun-dogfood
          cat > /tmp/ironrun-dogfood/policy.yml << 'EOF'
          version: "1"
          provider: env
          audit_log: /tmp/ironrun-dogfood/audit.log
          commands:
            - id: leak-check
              argv: [printenv, IRONRUN_DOGFOOD_CANARY]
              allow_network: true
              ttl: 30s
              env:
                IRONRUN_DOGFOOD_CANARY: env:IRONRUN_DOGFOOD_CANARY
          EOF
          echo "demo policy written"

      - name: Enable unprivileged network namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # 2 - RUN SEALED: the published, Sigstore-verified binary via the exact
      # consumer path (Action downloads + cosign-verify + seal + redact).
      - uses: generalized-labs/ironrun@v0.5.0
        with:
          command_id: leak-check
          policy: /tmp/ironrun-dogfood/policy.yml
          version: latest

      # 3 - VERIFY: the canary never reached what the job saw, the sealed run
      # actually redacted output, and the seal was genuinely armed.
      - name: "3 - Verify: no leak + real redaction + seal armed"
        run: |
          set -euo pipefail
          if [ ! -s /tmp/ironrun-dogfood/audit.log ]; then
            echo "FAIL: sealed run produced no audit record"; exit 1
          fi
          if grep -qF "$IRONRUN_DOGFOOD_CANARY" /tmp/ironrun-dogfood/audit.log; then
            echo "FAIL: canary secret leaked into the audit trail"; exit 1
          fi
          REDACTIONS="$(grep -o '"redaction_count":[0-9]*' /tmp/ironrun-dogfood/audit.log | tail -1 | cut -d: -f2)"
          [ "${REDACTIONS:-0}" -ge 1 ] || { echo "FAIL: audit shows redaction_count=$REDACTIONS, output was not redacted"; exit 1; }
          grep -q '"seccomp_installed":true' /tmp/ironrun-dogfood/audit.log             || { echo "FAIL: audit does not show seccomp_installed=true"; exit 1; }
          echo "PASS: canary never hit the job log; output redacted; seccomp armed; audit intact"

