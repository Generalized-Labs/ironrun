name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        # macOS covers the darwin sandbox-exec network-isolation path, which
        # the Linux-only runner never exercised.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enable unprivileged network namespaces (ubuntu 24.04+ AppArmor restriction breaks CLONE_NEWNET)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        # GITHUB_ACTIONS=false: ironrun refuses fork-PR events, and tests must
        # not inherit this job's event (a fork contributor's PR would fail).
        run: GITHUB_ACTIONS=false go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  npm-launcher:
    name: "npm launcher (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - name: Test verified launcher
        working-directory: npm
        run: node --test test/*.test.js
      - name: Verify publish contents
        working-directory: npm
        run: npm pack --dry-run
      # Install the real tarball so a lifecycle script missing from `files`
      # fails here, not for users. Postinstall is fail-open on network errors.
      - name: Install packed tarball
        working-directory: npm
        run: |
          tmp="$(mktemp -d)"
          npm pack --pack-destination "$tmp"
          mkdir "$tmp/install"
          npm install --prefix "$tmp/install" --no-audit --no-fund "$tmp"/*.tgz

  vulncheck:
    name: "Security — govulncheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Advisory, not a hard gate. govulncheck scans the Go standard library too,
      # and each Go patch release ships new advisories targeting the version
      # you're on — so a blocking job would go red on unrelated PRs whenever
      # upstream publishes a CVE. We keep the scan for visibility (findings show
      # in the log + a warning annotation) but don't block merges on it; keep the
      # toolchain current in go.mod to clear stdlib findings.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck reported advisories (non-blocking) — review the job log"

  # Security: verify secrets are redacted from output
  redact-check:
    name: "Security — stdout redaction"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enable unprivileged network namespaces (ubuntu 24.04+ AppArmor restriction breaks CLONE_NEWNET)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o bin/ironrun ./cmd/ironrun
      - name: Write test policy
        run: |
          cat > /tmp/redact-test.yml << 'EOF'
          version: "1"
          provider: env
          commands:
            - id: echo-secret
              argv: [printenv, IRONRUN_TEST_SECRET]
              ttl: 5s
              env:
                IRONRUN_TEST_SECRET: env:IRONRUN_CI_TEST_SECRET
          EOF
      - name: Run redaction test
        env:
          IRONRUN_CI_TEST_SECRET: "super-secret-value-that-must-not-appear"
        run: |
          # The secret is a literal test value; ignore the (possibly fork) PR event.
          OUTPUT="$(GITHUB_ACTIONS=false ./bin/ironrun run echo-secret --policy /tmp/redact-test.yml 2>&1)"
          echo "Output was: $OUTPUT"
          if echo "$OUTPUT" | grep -q "super-secret-value-that-must-not-appear"; then
            echo "FAIL: secret leaked into output!"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "\[REDACTED\]"; then
            echo "FAIL: expected [REDACTED] in output, got: $OUTPUT"
            exit 1
          fi
          echo "PASS: secret was redacted correctly"
