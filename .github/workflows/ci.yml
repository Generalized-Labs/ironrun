name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        # macOS covers the darwin sandbox-exec network-isolation path, which
        # the Linux-only runner never exercised.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race detector)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

  npm-launcher:
    name: "npm launcher (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Test verified launcher
        working-directory: npm
        run: node --test test/*.test.js
      - name: Verify publish contents
        working-directory: npm
        run: npm pack --dry-run

  vulncheck:
    name: "Security — govulncheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Advisory, not a hard gate. govulncheck scans the Go standard library too,
      # and each Go patch release ships new advisories targeting the version
      # you're on — so a blocking job would go red on unrelated PRs whenever
      # upstream publishes a CVE. We keep the scan for visibility (findings show
      # in the log + a warning annotation) but don't block merges on it; keep the
      # toolchain current in go.mod to clear stdlib findings.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck reported advisories (non-blocking) — review the job log"

  # Security: verify secrets are redacted from output
  redact-check:
    name: "Security — stdout redaction"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o bin/ironrun ./cmd/ironrun
      - name: Write test policy
        run: |
          cat > /tmp/redact-test.yml << 'EOF'
          version: "1"
          provider: env
          commands:
            - id: echo-secret
              argv: [printenv, IRONRUN_TEST_SECRET]
              ttl: 5s
              env:
                IRONRUN_TEST_SECRET: env:IRONRUN_CI_TEST_SECRET
          EOF
      - name: Run redaction test
        env:
          IRONRUN_CI_TEST_SECRET: "super-secret-value-that-must-not-appear"
        run: |
          OUTPUT="$(./bin/ironrun run echo-secret --policy /tmp/redact-test.yml 2>&1)"
          echo "Output was: $OUTPUT"
          if echo "$OUTPUT" | grep -q "super-secret-value-that-must-not-appear"; then
            echo "FAIL: secret leaked into output!"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "\[REDACTED\]"; then
            echo "FAIL: expected [REDACTED] in output, got: $OUTPUT"
            exit 1
          fi
          echo "PASS: secret was redacted correctly"
