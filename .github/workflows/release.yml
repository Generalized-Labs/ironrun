name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before release
        run: go test -race ./...

      - uses: anchore/sbom-action/download-syft@v0

      - uses: sigstore/cosign-installer@v3

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.5.1

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify immutable npm artifact manifest
        run: |
          node npm/scripts/build-manifest.mjs "$GITHUB_REF_NAME" dist
          node --test npm/test/*.test.js
          cd npm
          npm pack --dry-run

      # Non-blocking until the @generalized-labs npm scope is bootstrapped
      # (see docs/NPM_BOOTSTRAP.md). Remove continue-on-error to enforce npm
      # publishing once the scope + trusted publisher exist. The GitHub release,
      # curl installer, go install, and Sigstore signing do not depend on npm.
      - name: Stage release candidate on npm
        if: contains(github.ref_name, '-rc.')
        continue-on-error: true
        working-directory: npm
        run: npm publish --access public --provenance --tag next

      - name: Publish stable npm launcher
        if: ${{ !contains(github.ref_name, '-rc.') }}
        continue-on-error: true
        working-directory: npm
        run: npm publish --access public --provenance --tag latest

      - name: Keyless-sign release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          # install.sh is uploaded as a release asset by goreleaser
          # (release.extra_files); sign it here so it ships with a bundle like
          # every other artifact, as the release header promises.
          for artifact in dist/*.tar.gz dist/*.zip dist/checksums.txt install.sh; do
            [ -f "$artifact" ] || continue
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
          gh release upload "$GITHUB_REF_NAME" dist/*.sigstore.json install.sh.sigstore.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
