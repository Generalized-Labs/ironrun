name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before release
        run: go test -race ./...

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.5.1

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .goreleaser.yml brews.repository.token; GITHUB_TOKEN cannot push
          # to the tap repo, and an unset value fails the publish step.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Build and verify immutable npm artifact manifest
        run: |
          node npm/scripts/build-manifest.mjs "$GITHUB_REF_NAME" dist
          node --test npm/test/*.test.js
          cd npm
          npm pack --dry-run

      # Non-blocking until the @generalized-labs npm scope is bootstrapped
      # (see docs/NPM_BOOTSTRAP.md). Remove continue-on-error to enforce npm
      # publishing once the scope + trusted publisher exist. The GitHub release,
      # curl installer, go install, and Sigstore signing do not depend on npm.
      - name: Stage release candidate on npm
        if: contains(github.ref_name, '-rc.')
        continue-on-error: true
        working-directory: npm
        run: npm publish --access public --provenance --tag next

      - name: Publish stable npm launcher
        if: ${{ !contains(github.ref_name, '-rc.') }}
        continue-on-error: true
        working-directory: npm
        run: npm publish --access public --provenance --tag latest

      - name: Keyless-sign release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          # install.sh is uploaded as a release asset by goreleaser
          # (release.extra_files); sign it here so it ships with a bundle like
          # every other artifact, as the release header promises.
          for artifact in dist/*.tar.gz dist/*.zip dist/checksums.txt install.sh; do
            [ -f "$artifact" ] || continue
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
          gh release upload "$GITHUB_REF_NAME" dist/*.sigstore.json install.sh.sigstore.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
