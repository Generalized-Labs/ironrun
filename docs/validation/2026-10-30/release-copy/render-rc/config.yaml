version: 2
project_name: ironrun
release:
  github:
    owner: generalized-labs
    name: ironrun
  draft: true
  prerelease: auto
  name_template: ironrun {{.Tag}}
  extra_files:
    - glob: ./install.sh
  header: |
    ## ironrun {{.Tag}}

    Local-first encrypted environment workspace for humans and AI coding agents.
    Agents receive approved capabilities and redacted output, never reveal APIs.

    ### Install this release

    Supports Linux and macOS on amd64 and arm64. Requires `curl`, `tar`, and
    `sha256sum` or `shasum`. The installer uses `cosign` for signature verification;
    if it is absent, the installer downloads a pinned verifier and checks its
    SHA-256 before running it. Network access is needed for those downloads and
    Sigstore verification.

    ```bash
    # Pinned installer for this exact release. The script Sigstore-verifies
    # checksums.txt and the tarball, and SHA-256-verifies the tarball
    # against checksums.txt — it refuses to install on any failure.
    curl -fsSL https://github.com/generalized-labs/ironrun/releases/download/{{.Tag}}/install.sh -o /tmp/install-ironrun.sh
    sh /tmp/install-ironrun.sh --version {{.Tag}}

    ```

    ### Build from source

    With the Go toolchain required by this tag:

    ```bash
    go install github.com/generalized-labs/ironrun/cmd/ironrun@{{.Tag}}
    ```

    A Go source build is separate from the signed release binaries above.
    npm and Homebrew availability is managed separately: npm requires
    [package bootstrap](https://github.com/generalized-labs/ironrun/blob/{{.Tag}}/docs/NPM_BOOTSTRAP.md),
    and the Homebrew cask requires a verified
    [tap migration](https://github.com/generalized-labs/ironrun/blob/{{.Tag}}/docs/HOMEBREW_MIGRATION.md).
    This GitHub release does not establish that either channel is ready.

    Prefer the versioned `install.sh` above over `https://ironrun.dev/install.sh`,
    which can follow a newer release instead of pinning this tag. Every release
    artifact (`ironrun_<OS>_<arch>.tar.gz`, `checksums.txt`, `install.sh`)
    ships with a `<file>.sigstore.json` bundle signed keylessly by the
    release workflow; see the
    [installation guide](https://github.com/generalized-labs/ironrun/blob/{{.Tag}}/docs/INSTALL.md)
    for manual verification and current channel requirements.
  footer: |
    **Full Changelog**: https://github.com/generalized-labs/ironrun/compare/{{.PreviousTag}}...{{.Tag}}
builds:
  - id: render-only
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    goamd64:
      - v1
    go386:
      - sse2
    goarm:
      - "6"
    goarm64:
      - v8.0
    gomips:
      - hardfloat
    goppc64:
      - power8
    goriscv64:
      - rva20u64
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
      - linux_386_sse2
      - darwin_amd64_v1
      - darwin_arm64_v8.0
      - windows_amd64_v1
      - windows_arm64_v8.0
      - windows_386_sse2
    dir: .
    main: .
    binary: ironrun
    builder: go
    skip: "true"
    tool: go
    command: build
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
archives:
  - id: default
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 "v1") }}{{ .Amd64 }}{{ end }}'
    formats:
      - tar.gz
    files:
      - src: license*
      - src: LICENSE*
      - src: readme*
      - src: README*
      - src: changelog*
      - src: CHANGELOG*
srpm:
  package_name: ironrun
  file_name_template: '{{ .PackageName }}-{{ .Version }}.src.rpm'
  bins:
    ironrun: '%{goipath}'
snapshot:
  version_template: '{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}'
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256
docker_digest:
  name_template: digests.txt
changelog:
  use: git
  format: '{{ .SHA }} {{ .Message }}'
dist: /workspace/ironrun-product-research/launch-20261030/release-copy/render-rc
env_files:
  github_token: ~/.config/goreleaser/github_token
  gitlab_token: ~/.config/goreleaser/gitlab_token
  gitea_token: ~/.config/goreleaser/gitea_token
source:
  name_template: '{{ .ProjectName }}-{{ .Version }}'
  format: tar.gz
gomod:
  gobinary: go
announce:
  twitter:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  mastodon:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    server: ""
  reddit:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    url_template: '{{ .ReleaseURL }}'
  slack:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: GoReleaser
  discord:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    author: GoReleaser
    color: "3888754"
    icon_url: https://goreleaser.com/static/avatar.png
  teams:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    color: '#2D313E'
    icon_url: https://goreleaser.com/static/avatar.png
  smtp:
    subject_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    body_template: 'You can view details from: {{ .ReleaseURL }}'
  mattermost:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    color: '#2D313E'
    username: GoReleaser
  linkedin:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  telegram:
    message_template: '{{ print .ProjectName " " .Tag " is out! Check it out at " .ReleaseURL | mdv2escape }}'
    parse_mode: MarkdownV2
  webhook:
    message_template: '{ "message": "{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}"}'
    content_type: application/json; charset=utf-8
    expected_status_codes:
      - 200
      - 201
      - 202
      - 204
  opencollective:
    title_template: '{{ .Tag }}'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out!<br/>Check it out at <a href="{{ .ReleaseURL }}">{{ .ReleaseURL }}</a>'
  bluesky:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  discourse:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: system
git:
  tag_sort: -version:refname
mcp:
  name: ""
  title: ""
  auth:
    type: none
retry:
  attempts: 10
  delay: 10s
  max_delay: 5m0s
github_urls:
  download: https://github.com
gitlab_urls:
  download: https://gitlab.com
