version: 2
project_name: ironrun
release:
  github:
    owner: generalized-labs
    name: ironrun
  draft: true
  prerelease: auto
  name_template: ironrun {{.Tag}}
  extra_files:
    - glob: ./install.sh
  header: |
    ## ironrun {{.Tag}}

    Local-first encrypted environment workspace for humans and AI coding agents.
    Agents receive approved capabilities and redacted output, never reveal APIs.

    ### Quick install

    ```bash
    # Pinned installer for this exact release. The script Sigstore-verifies
    # checksums.txt and the tarball, and SHA-256-verifies the tarball
    # against checksums.txt — it refuses to install on any failure.
    curl -fsSL https://github.com/generalized-labs/ironrun/releases/download/{{.Tag}}/install.sh -o /tmp/install-ironrun.sh
    sh /tmp/install-ironrun.sh --version {{.Tag}}

    # Homebrew (tap)
    brew tap generalized-labs/tap
    brew install --cask ironrun

    # npm / npx (verified launcher; downloads the matching release binary)
    npx @generalized-labs/ironrun

    # Go
    go install github.com/generalized-labs/ironrun/cmd/ironrun@{{.Tag}}
    ```

    Prefer the versioned `install.sh` above over `https://ironrun.dev/install.sh`,
    which can follow a newer release instead of pinning this tag. Every release
    artifact (`ironrun_<OS>_<arch>.tar.gz`, `checksums.txt`, `install.sh`)
    ships with a `<file>.sigstore.json` bundle signed keylessly by the
    release workflow; see docs/INSTALL.md for manual verification.
  footer: |
    **Full Changelog**: https://github.com/generalized-labs/ironrun/compare/{{.PreviousTag}}...{{.Tag}}
homebrew_casks:
  - name: ironrun
    repository:
      owner: generalized-labs
      name: homebrew-tap
      token: '{{ .Env.TAP_GITHUB_TOKEN }}'
      branch: ironrun-{{ .Version }}
      pull_request:
        enabled: true
        draft: true
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: Brew cask update for {{ .ProjectName }} version {{ .Tag }}
    directory: Casks
    description: Local-first encrypted environments and filtered command execution
    homepage: https://github.com/Generalized-Labs/ironrun
    skip_upload: auto
    binaries:
      - ironrun
    license: MIT
builds:
  - id: ironrun
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    go386:
      - sse2
    goarm:
      - "6"
    goarm64:
      - v8.0
    gomips:
      - hardfloat
    goppc64:
      - power8
    goriscv64:
      - rva20u64
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
      - darwin_amd64_v1
      - darwin_arm64_v8.0
    dir: .
    main: ./cmd/ironrun
    binary: ironrun
    builder: go
    tool: go
    command: build
    ldflags:
      - -s -w
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Version={{.Version}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Date={{.CommitDate}}
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
archives:
  - id: ironrun
    ids:
      - ironrun
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "arm64" }}arm64 {{- else }}{{ .Arch }}{{ end }}'
    formats:
      - tar.gz
    files:
      - src: README.md
      - src: LICENSE
      - src: ironrun.example.yml
srpm:
  package_name: ironrun
  file_name_template: '{{ .PackageName }}-{{ .Version }}.src.rpm'
  bins:
    ironrun: '%{goipath}'
snapshot:
  version_template: '{{ incpatch .Version }}-next'
checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./install.sh
docker_digest:
  name_template: digests.txt
changelog:
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  sort: asc
  use: github
  format: '{{ .SHA }}: {{ .Message }} ({{ with .AuthorUsername }}@{{ . }}{{ else }}{{ .AuthorName }} <{{ .AuthorEmail }}>{{ end }})'
  groups:
    - title: New Features
      regexp: ^feat
    - title: Bug Fixes
      regexp: ^fix
      order: 1
    - title: Security
      regexp: ^sec
      order: 2
    - title: Other
      order: 999
dist: /workspace/ironrun-product-research/launch-20261026/snapshot/dist-run2
env_files:
  github_token: ~/.config/goreleaser/github_token
  gitlab_token: ~/.config/goreleaser/gitlab_token
  gitea_token: ~/.config/goreleaser/gitea_token
before:
  hooks:
    - go mod tidy
    - go generate ./...
source:
  name_template: '{{ .ProjectName }}-{{ .Version }}'
  format: tar.gz
gomod:
  gobinary: go
announce:
  twitter:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  mastodon:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    server: ""
  reddit:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    url_template: '{{ .ReleaseURL }}'
  slack:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: GoReleaser
  discord:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    author: GoReleaser
    color: "3888754"
    icon_url: https://goreleaser.com/static/avatar.png
  teams:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    color: '#2D313E'
    icon_url: https://goreleaser.com/static/avatar.png
  smtp:
    subject_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    body_template: 'You can view details from: {{ .ReleaseURL }}'
  mattermost:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    color: '#2D313E'
    username: GoReleaser
  linkedin:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  telegram:
    message_template: '{{ print .ProjectName " " .Tag " is out! Check it out at " .ReleaseURL | mdv2escape }}'
    parse_mode: MarkdownV2
  webhook:
    message_template: '{ "message": "{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}"}'
    content_type: application/json; charset=utf-8
    expected_status_codes:
      - 200
      - 201
      - 202
      - 204
  opencollective:
    title_template: '{{ .Tag }}'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out!<br/>Check it out at <a href="{{ .ReleaseURL }}">{{ .ReleaseURL }}</a>'
  bluesky:
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
  discourse:
    title_template: '{{ .ProjectName }} {{ .Tag }} is out!'
    message_template: '{{ .ProjectName }} {{ .Tag }} is out! Check it out at {{ .ReleaseURL }}'
    username: system
sboms:
  - id: default
    cmd: syft
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
    args:
      - $artifact
      - --output
      - spdx-json=$document
      - --enrich
      - all
    documents:
      - '{{ .ArtifactName }}.sbom.json'
    artifacts: archive
git:
  tag_sort: -version:refname
mcp:
  name: ""
  title: ""
  auth:
    type: none
retry:
  attempts: 10
  delay: 10s
  max_delay: 5m0s
github_urls:
  download: https://github.com
gitlab_urls:
  download: https://gitlab.com
