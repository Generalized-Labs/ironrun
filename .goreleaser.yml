# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser v2 config
version: 2

project_name: ironrun

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: ironrun
    main: ./cmd/ironrun
    binary: ironrun
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Version={{.Version}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Date={{.Date}}

archives:
  - id: ironrun
    ids:
      - ironrun
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - ironrun.example.yml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Security"
      regexp: "^sec"
      order: 2
    - title: Other
      order: 999

# Homebrew auto-publish via the generalized-labs/homebrew-tap formula. Using a
# `brews` (formula) block — not `homebrew_casks` — keeps `brew install` working
# on BOTH macOS and Linux (the README/release header advertise both). `brews` is
# deprecated in goreleaser v2 but still functional; if a future goreleaser hard-
# fails on it, switch to the `homebrew_casks` form (macOS-only — Linux users then
# fall back to the curl installer or `go install`, both already documented).
#
# REQUIRES (maintainer, one-time): a HOMEBREW_TAP_GITHUB_TOKEN repo secret with
# write access to generalized-labs/homebrew-tap (release.yml already passes it
# through), and deletion of the hand-maintained Formula/ironrun.rb in the tap so
# goreleaser owns the formula (otherwise the two collide).
brews:
  - name: ironrun
    repository:
      owner: generalized-labs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/generalized-labs/ironrun"
    description: "Agent-safe sealed command execution. Secrets injected below AI context windows."
    license: "MIT"
    commit_author:
      name: goreleaser-bot
      email: bot@generalized-labs.dev
    test: |
      system "#{bin}/ironrun", "version"

release:
  github:
    owner: generalized-labs
    name: ironrun
  draft: false
  prerelease: auto
  name_template: "ironrun {{.Tag}}"
  header: |
    ## ironrun {{.Tag}}

    Agent-safe sealed command execution for AI coding agents.
    Secrets are injected below agent visibility and redacted from all output.

    ### Quick install

    ```bash
    # Homebrew (macOS/Linux)
    brew install generalized-labs/tap/ironrun

    # curl (Linux/macOS)
    curl -fsSL https://raw.githubusercontent.com/generalized-labs/ironrun/main/install.sh | bash

    # Go
    go install github.com/generalized-labs/ironrun/cmd/ironrun@{{.Tag}}
    ```
  footer: |
    **Full Changelog**: https://github.com/generalized-labs/ironrun/compare/{{.PreviousTag}}...{{.Tag}}
