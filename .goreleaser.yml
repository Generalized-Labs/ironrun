# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser v2 config
version: 2

project_name: ironrun

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: ironrun
    main: ./cmd/ironrun
    binary: ironrun
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # -trimpath strips local filesystem paths from the binary so two builds
    # of the same source produce identical bytes (see docs/INSTALL.md,
    # "Reproducible builds"). It is a *build* flag, not a linker flag.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Version={{.Version}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Date={{.Date}}

brews:
  - repository:
      owner: generalized-labs
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    description: "Local-first encrypted environment runtime — agents use secrets, never see them"
    homepage: "https://github.com/Generalized-Labs/ironrun"
    license: "MIT"

archives:
  - id: ironrun
    ids:
      - ironrun
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - ironrun.example.yml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # Ship the installer as a release asset and cover it with checksums.txt
  # (which is itself Sigstore-signed in .github/workflows/release.yml), so
  # the script users run is pinned to this exact release.
  extra_files:
    - glob: ./install.sh

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Security"
      regexp: "^sec"
      order: 2
    - title: Other
      order: 999

release:
  github:
    owner: generalized-labs
    name: ironrun
  draft: false
  prerelease: auto
  # Upload the installer as a release asset: the release header's quick-install
  # URL points at it, and checksum.extra_files only puts it in checksums.txt
  # (it does NOT upload it).
  extra_files:
    - glob: ./install.sh
  name_template: "ironrun {{.Tag}}"
  header: |
    ## ironrun {{.Tag}}

    Local-first encrypted environment workspace for humans and AI coding agents.
    Agents receive approved capabilities and redacted output, never reveal APIs.

    ### Quick install

    ```bash
    # Pinned installer for this exact release. The script Sigstore-verifies
    # checksums.txt and the tarball, and SHA-256-verifies the tarball
    # against checksums.txt — it refuses to install on any failure.
    curl -fsSL https://github.com/generalized-labs/ironrun/releases/download/{{.Tag}}/install.sh -o /tmp/install-ironrun.sh
    sh /tmp/install-ironrun.sh --version {{.Tag}}

    # Homebrew (tap)
    brew tap generalized-labs/tap
    brew install ironrun

    # npm / npx (verified launcher; downloads the matching release binary)
    npx @generalized-labs/ironrun

    # Go
    go install github.com/generalized-labs/ironrun/cmd/ironrun@{{.Tag}}
    ```

    Prefer the versioned `install.sh` above over `https://ironrun.dev/install.sh`,
    which currently redirects to the moving `main` branch. Every release
    artifact (`ironrun_<OS>_<arch>.tar.gz`, `checksums.txt`, `install.sh`)
    ships with a `<file>.sigstore.json` bundle signed keylessly by the
    release workflow; see docs/INSTALL.md for manual verification.
  footer: |
    **Full Changelog**: https://github.com/generalized-labs/ironrun/compare/{{.PreviousTag}}...{{.Tag}}
