# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser v2 config
version: 2

project_name: ironrun

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: ironrun
    main: ./cmd/ironrun
    binary: ironrun
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # -trimpath strips local filesystem paths from the binary so two builds
    # of the same source produce identical bytes (see docs/INSTALL.md,
    # "Reproducible builds"). It is a *build* flag, not a linker flag.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Version={{.Version}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Date={{.CommitDate}}

homebrew_casks:
  - repository:
      owner: generalized-labs
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      branch: "ironrun-{{ .Version }}"
      # Stage the cask on a versioned branch until the signed GitHub release
      # is public and a maintainer has checked the generated cask/migration.
      pull_request:
        enabled: true
        draft: true
    directory: Casks
    binaries:
      - ironrun
    skip_upload: auto
    description: "Local-first encrypted environments and filtered command execution"
    homepage: "https://github.com/Generalized-Labs/ironrun"
    license: "MIT"

archives:
  - id: ironrun
    ids:
      - ironrun
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - ironrun.example.yml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # Ship the installer as a release asset and cover it with checksums.txt
  # (which is itself Sigstore-signed in .github/workflows/release.yml), so
  # the script users run is pinned to this exact release.
  extra_files:
    - glob: ./install.sh

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Security"
      regexp: "^sec"
      order: 2
    - title: Other
      order: 999

release:
  github:
    owner: generalized-labs
    name: ironrun
  # The workflow signs and verifies all assets before making this public.
  draft: true
  prerelease: auto
  # Upload the installer as a release asset: the release header's quick-install
  # URL points at it, and checksum.extra_files only puts it in checksums.txt
  # (it does NOT upload it).
  extra_files:
    - glob: ./install.sh
  name_template: "ironrun {{.Tag}}"
  header: |
    ## ironrun {{.Tag}}

    Local-first encrypted environment workspace for humans and AI coding agents.
    Agents receive approved capabilities and redacted output, never reveal APIs.

    ### Install this release

    Supports Linux and macOS on amd64 and arm64. Requires `curl`, `tar`, and
    `sha256sum` or `shasum`. The installer uses `cosign` for signature verification;
    if it is absent, the installer downloads a pinned verifier and checks its
    SHA-256 before running it. Network access is needed for those downloads and
    Sigstore verification.

    ```bash
    # Pinned installer for this exact release. The script Sigstore-verifies
    # checksums.txt and the tarball, and SHA-256-verifies the tarball
    # against checksums.txt — it refuses to install on any failure.
    curl -fsSL https://github.com/generalized-labs/ironrun/releases/download/{{.Tag}}/install.sh -o /tmp/install-ironrun.sh
    sh /tmp/install-ironrun.sh --version {{.Tag}}

    ```

    ### Build from source

    With the Go toolchain required by this tag:

    ```bash
    go install github.com/generalized-labs/ironrun/cmd/ironrun@{{.Tag}}
    ```

    A Go source build is separate from the signed release binaries above.
    npm and Homebrew availability is managed separately: npm requires
    [package bootstrap](https://github.com/generalized-labs/ironrun/blob/{{.Tag}}/docs/NPM_BOOTSTRAP.md),
    and the Homebrew cask requires a verified
    [tap migration](https://github.com/generalized-labs/ironrun/blob/{{.Tag}}/docs/HOMEBREW_MIGRATION.md).
    This GitHub release does not establish that either channel is ready.

    Prefer the versioned `install.sh` above over `https://ironrun.dev/install.sh`,
    which can follow a newer release instead of pinning this tag. Every release
    artifact (`ironrun_<OS>_<arch>.tar.gz`, `checksums.txt`, `install.sh`)
    ships with a `<file>.sigstore.json` bundle signed keylessly by the
    release workflow; see the
    [installation guide](https://github.com/generalized-labs/ironrun/blob/{{.Tag}}/docs/INSTALL.md)
    for manual verification and current channel requirements.
  footer: |
    **Full Changelog**: https://github.com/generalized-labs/ironrun/compare/{{.PreviousTag}}...{{.Tag}}
