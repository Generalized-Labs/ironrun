# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser v2 config
version: 2

project_name: ironrun

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: ironrun
    main: ./cmd/ironrun
    binary: ironrun
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Version={{.Version}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Commit={{.Commit}}
      - -X github.com/generalized-labs/ironrun/internal/buildinfo.Date={{.Date}}

archives:
  - id: ironrun
    ids:
      - ironrun
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - ironrun.example.yml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New Features"
      regexp: "^feat"
      order: 0
    - title: "Bug Fixes"
      regexp: "^fix"
      order: 1
    - title: "Security"
      regexp: "^sec"
      order: 2
    - title: Other
      order: 999

release:
  github:
    owner: generalized-labs
    name: ironrun
  draft: false
  prerelease: auto
  name_template: "ironrun {{.Tag}}"
  header: |
    ## ironrun {{.Tag}}

    Local-first encrypted environment workspace for humans and AI coding agents.
    Agents receive approved capabilities and redacted output, never reveal APIs.

    ### Quick install

    ```bash
    # curl (Linux/macOS — verifies the checksum)
    curl -fsSL https://ironrun.dev/install.sh -o /tmp/ironrun-install.sh
    bash /tmp/ironrun-install.sh

    # Go
    go install github.com/generalized-labs/ironrun/cmd/ironrun@{{.Tag}}
    ```
  footer: |
    **Full Changelog**: https://github.com/generalized-labs/ironrun/compare/{{.PreviousTag}}...{{.Tag}}
